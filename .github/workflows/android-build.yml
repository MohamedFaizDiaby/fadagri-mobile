name: Android build

# Builds the debug APK on every push and pull request, and can be triggered
# manually. Runs on GitHub's Linux runners — this exists because Gradle's
# loopback daemon socket doesn't work under this project's local Windows dev
# sandbox (a documented Java/Windows AppContainer issue, unrelated to the
# app itself), so CI is the reliable way to actually produce and verify a
# build until that's resolved locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `node_modules` is required at build time: android/capacitor.settings.gradle
      # points capacitor-android and capacitor-splash-screen straight at
      # node_modules/@capacitor/*, unlike a typical Android project.
      - name: Install dependencies
        run: npm ci

      # Deliberately NOT running `npx cap sync` here: the native android/
      # project (including capacitor-cordova-android-plugins, see its
      # .gitignore note) is committed as-is and self-contained. `cap sync`
      # regenerates that folder from installed Cordova plugins — since this
      # project has none, it wipes cordova.variables.gradle right back out
      # and the build fails the same way a manual `cap sync` does locally
      # (ionic-team/ionic-framework#22894).

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: fadagri-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
