name: Android build

# Builds the debug APK on every push and pull request, and can be triggered
# manually. Runs on GitHub's Linux runners — this exists because Gradle's
# loopback daemon socket doesn't work under this project's local Windows dev
# sandbox (a documented Java/Windows AppContainer issue, unrelated to the
# app itself), so CI is the reliable way to actually produce and verify a
# build until that's resolved locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: fadagri-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
